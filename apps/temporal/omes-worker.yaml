apiVersion: apps/v1
kind: Deployment
metadata:
  name: omes-worker
  labels:
    app.kubernetes.io/name: omes-worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: omes-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omes-worker
    spec:
      containers:
        - name: omes-worker
          image: temporaliotest/omes:go-dae0843
          args:
            - --run-id=load-test
            - --server-address=temporal-frontend-headless.temporal.svc.cluster.local:7233
            - --namespace=dittofeed
            - --worker-workflow-poller-autoscale-max=100
            - --worker-activity-poller-autoscale-max=100
            - --worker-max-concurrent-workflow-tasks=1000
            - --worker-max-concurrent-activities=1000
          env:
            - name: GOMEMLIMIT
              value: "870MiB"
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
