apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: temporal
    repo: https://go.temporal.io/helm-charts
    version: 1.7.0
    releaseName: temporal
    namespace: temporal
    valuesFile: settings.yaml
    additionalValuesFiles:
    - replicas.yaml
    - version.yaml
    - namespaces.yaml
resources:
  - omes-worker.yaml
  - omes-scenario.yaml
configMapGenerator:
  - name: omes-payload
    files:
      - payload.json=omes-payload.json
patches:
  - target:
      kind: Service
      labelSelector: app.kubernetes.io/headless=true
    patch: |-
      - op: remove
        path: /metadata/annotations/prometheus.io~1scrape
