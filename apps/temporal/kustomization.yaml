apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: temporal
    repo: https://go.temporal.io/helm-charts
    version: 1.7.0
    releaseName: temporal
    namespace: temporal
    valuesFile: settings.yaml
    additionalValuesFiles:
    - replicas.yaml
    - version.yaml
