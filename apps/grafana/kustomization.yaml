apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: grafana
    repo: https://grafana-community.github.io/helm-charts
    version: 13.5.0
    releaseName: grafana
    namespace: observability
    valuesFile: settings.yaml
    additionalValuesFiles:
    - replicas.yaml
    - version.yaml
configMapGenerator:
  - name: grafana-dashboard-temporal-server
    namespace: observability
    files:
    - dashboards/temporal-server.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
